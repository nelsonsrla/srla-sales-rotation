<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SRLA Photos">
  <meta name="format-detection" content="telephone=no">
  <title>Showroom LA · Photos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.shopify.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:               #FAFAF7;
      --bg-elevated:      #FFFFFF;
      --bg-skeleton:      #EFEDE7;
      --bg-pill-hover:    #F2F0EA;
      --text-primary:     #0A0A0A;
      --text-secondary:   #6B6B66;
      --text-tertiary:    #A8A8A2;
      --border:           #E8E6E0;
      --border-strong:    #D4D2CC;
      --accent:           #0A0A0A;
      --accent-hover:     #2A2A28;
      --sale:             #B8410E;
      --success:          #2C5F2D;
      --font-sans:        'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --motion-fast:      180ms cubic-bezier(0.4, 0, 0.2, 1);
      --motion-base:      280ms cubic-bezier(0.4, 0, 0.2, 1);
      --motion-slow:      480ms cubic-bezier(0.4, 0, 0.2, 1);
      --motion-bounce:    320ms cubic-bezier(0.34, 1.56, 0.64, 1);
      --shadow-soft:      0 1px 2px rgba(10, 10, 10, 0.04);
      --shadow-floating:  0 8px 32px rgba(10, 10, 10, 0.12);
      --shadow-sheet:     0 -8px 40px rgba(10, 10, 10, 0.18);
      --header-h-mobile:  56px;
      --header-h-desktop: 72px;
      --safe-bottom:      env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    body {
      margin: 0; padding: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'cv11', 'ss01', 'ss03';
      letter-spacing: -0.005em;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
    }
    body.sheet-open, body.drawer-open, body.share-open { overflow: hidden; }
    img { display: block; max-width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ============================================
       HEADER
       ============================================ */
    .header {
      position: sticky; top: 0; z-index: 100;
      height: var(--header-h-mobile);
      background: rgba(250, 250, 247, 0.92);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      transition: border-color var(--motion-base);
    }
    @media (min-width: 768px) { .header { height: var(--header-h-desktop); padding: 0 32px; } }
    .logo { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--text-primary); }
    .logo-mark { font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
    .logo-divider { width: 1px; height: 12px; background: var(--border-strong); display: inline-block; }
    .logo-label { font-size: 11px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-secondary); }
    @media (min-width: 768px) { .logo-mark { font-size: 15px; letter-spacing: 0.22em; } .logo-label { font-size: 12px; } }
    .header-controls { display: flex; align-items: center; gap: 8px; }

    .pill {
      position: relative;
      display: inline-flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 16px;
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      font-size: 12px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-primary);
      transition: all var(--motion-fast);
      white-space: nowrap;
    }
    @media (min-width: 768px) { .pill { height: 36px; padding: 0 14px; } }
    .pill:hover { border-color: var(--text-primary); background: var(--bg-elevated); }
    .pill:disabled { opacity: 0.4; cursor: not-allowed; }
    .pill:disabled:hover { border-color: var(--border-strong); background: transparent; }
    .pill svg { width: 14px; height: 14px; stroke: currentColor; }
    .pill.active { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
    .pill-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 6px;
      background: var(--accent); color: #FFFFFF;
      border-radius: 999px;
      font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
      margin-left: 2px;
    }
    .pill.active .pill-badge { background: #FFFFFF; color: var(--accent); }

    .col-toggle { display: inline-flex; height: 44px; border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden; background: transparent; }
    @media (min-width: 768px) { .col-toggle { height: 36px; } }
    .col-toggle button { width: 44px; height: 100%; background: transparent; border: none; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: all var(--motion-fast); }
    @media (min-width: 768px) { .col-toggle button { width: 36px; } }
    .col-toggle button:hover { color: var(--text-primary); }
    .col-toggle button.active { background: var(--accent); color: #FFFFFF; }
    .col-toggle button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .pill-text { display: none; }
    @media (min-width: 640px) { .pill-text { display: inline; } }
    @media (max-width: 380px) { .col-toggle { display: none; } }

    /* ============================================
       MAIN
       ============================================ */
    main { max-width: 1600px; margin: 0 auto; padding: 24px 16px calc(160px + var(--safe-bottom)); width: 100%; }
    @media (min-width: 768px) { main { padding: 40px 32px 180px; } }
    @media (min-width: 1200px) { main { padding: 48px 48px 200px; } }

    .intro { margin-bottom: 24px; }
    @media (min-width: 768px) { .intro { margin-bottom: 32px; } }
    .intro-eyebrow { font-size: 11px; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 8px; }
    .intro-title { font-size: 30px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.05; margin: 0; }
    @media (min-width: 768px) { .intro-title { font-size: 44px; } }
    .intro-meta {
      font-size: 11px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-secondary); margin: 14px 0 0; min-height: 16px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .intro-meta .sep {
      width: 2px; height: 2px; border-radius: 50%;
      background: var(--text-tertiary);
      flex-shrink: 0;
      display: inline-block;
    }

    .loading-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-primary);
      animation: loading-pulse 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes loading-pulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

    /* ============================================
       TOOLBAR
       ============================================ */
    .toolbar {
      position: sticky;
      top: var(--header-h-mobile);
      z-index: 50;
      background: rgba(250, 250, 247, 0.92);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      margin: 0 -16px 24px;
      padding: 12px 16px;
      border-bottom: 1px solid transparent;
      transition: border-color var(--motion-base);
    }
    @media (min-width: 768px) {
      .toolbar { top: var(--header-h-desktop); margin: 0 -32px 32px; padding: 16px 32px; }
    }
    @media (min-width: 1200px) {
      .toolbar { margin: 0 -48px 32px; padding: 16px 48px; }
    }
    .toolbar.scrolled { border-bottom-color: var(--border); }
    .toolbar-inner { display: flex; align-items: center; gap: 12px; max-width: 1600px; margin: 0 auto; }

    .category-pills {
      display: flex; gap: 6px;
      overflow-x: auto;
      flex: 1;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
      mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 24px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 24px), transparent 100%);
    }
    .category-pills::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0;
      height: 38px; padding: 0 16px;
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      font-size: 11px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-secondary);
      transition: all var(--motion-fast);
      white-space: nowrap;
    }
    @media (min-width: 768px) { .cat-pill { height: 34px; } }
    .cat-pill:hover { color: var(--text-primary); border-color: var(--text-primary); }
    .cat-pill.active { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }

    .sort-wrap { position: relative; flex-shrink: 0; }
    .sort-button {
      display: inline-flex; align-items: center; gap: 6px;
      height: 38px; padding: 0 14px;
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      font-size: 11px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-primary);
      transition: all var(--motion-fast);
      white-space: nowrap;
    }
    @media (min-width: 768px) { .sort-button { height: 34px; } }
    .sort-button:hover { border-color: var(--text-primary); }
    .sort-button svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2; transition: transform var(--motion-fast); }
    .sort-button.open svg { transform: rotate(180deg); }

    .sort-menu {
      position: absolute; top: calc(100% + 6px); right: 0;
      min-width: 220px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      box-shadow: var(--shadow-floating);
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: all var(--motion-fast);
      z-index: 60;
    }
    .sort-menu.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .sort-option {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 12px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px; font-weight: 400;
      color: var(--text-primary);
      text-align: left;
      transition: background var(--motion-fast);
    }
    .sort-option:hover { background: var(--bg-pill-hover); }
    .sort-option.active { font-weight: 500; }
    .sort-option .check { width: 14px; height: 14px; opacity: 0; }
    .sort-option.active .check { opacity: 1; }
    .sort-option .check svg { width: 100%; height: 100%; stroke: var(--accent); fill: none; stroke-width: 2; }

    /* ============================================
       GRID + CARDS
       ============================================ */
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
    @media (min-width: 768px) { .grid { gap: 28px; } }
    @media (min-width: 1024px) {
      .grid[data-cols="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .grid[data-cols="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; }
      .grid[data-cols="1"] { grid-template-columns: minmax(0, 1fr); max-width: 720px; margin-inline: auto; gap: 56px; }
    }
    @media (max-width: 1023px) {
      .grid[data-cols="1"] { grid-template-columns: minmax(0, 1fr); }
      .grid[data-cols="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* At-cap visual: dim non-selected cards */
    .grid.at-cap .card:not(.selected) {
      opacity: 0.45;
      transition: opacity var(--motion-base);
    }

    .card {
      display: flex; flex-direction: column;
      cursor: pointer;
      opacity: 0; transform: translateY(8px);
      animation: card-in var(--motion-slow) forwards;
      transition: transform var(--motion-bounce);
    }
    @keyframes card-in { to { opacity: 1; transform: translateY(0); } }
    .card.tap-bounce .card-image-wrap { transform: scale(0.97); }
    .card-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--bg-skeleton);
      overflow: hidden;
      transition: transform var(--motion-bounce);
    }
    @supports not (aspect-ratio: 1) {
      .card-image-wrap::before { content: ''; display: block; padding-bottom: 100%; }
      .card-image-wrap > * { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    }
    .card-image { width: 100%; height: 100%; object-fit: cover; transition: transform var(--motion-slow), opacity var(--motion-base); opacity: 0; }
    .card-image.loaded { opacity: 1; }
    .card:hover .card-image { transform: scale(1.02); }

    .card-badges { position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 2; pointer-events: none; max-width: calc(100% - 56px); }
    .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; border-radius: 999px; background: rgba(255, 255, 255, 0.94); color: var(--text-primary); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .badge.new { background: var(--accent); color: #FFFFFF; }
    .badge.sale { background: var(--sale); color: #FFFFFF; }
    .badge.in-store { background: rgba(10, 10, 10, 0.86); color: #FFFFFF; }

    .card-check {
      position: absolute; top: 10px; right: 10px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(10, 10, 10, 0.08);
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
      opacity: 0;
      transform: scale(0.92);
      transition: all var(--motion-fast);
    }
    .card:hover .card-check { opacity: 1; transform: scale(1); }
    .card.selected .card-check {
      opacity: 1; transform: scale(1);
      background: var(--accent);
      border-color: var(--accent);
    }
    .card-check svg { width: 14px; height: 14px; stroke: var(--accent); stroke-width: 2.5; fill: none; opacity: 0; transition: opacity var(--motion-fast); }
    .card.selected .card-check svg { stroke: #FFFFFF; opacity: 1; }
    /* Always show check on touch devices once selected */
    @media (hover: none) {
      .card.selected .card-check { opacity: 1; transform: scale(1); }
    }

    .card-meta { padding: 14px 4px 0; }
    @media (min-width: 768px) { .card-meta { padding: 18px 0 0; } }
    .card-brand {
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin: 0 0 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    @media (min-width: 768px) { .card-brand { font-size: 11px; margin: 0 0 8px; } }

    /* Fix: title + price properly aligned, title gets ellipsis on overflow */
    .card-bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card-title {
      font-size: 12px; font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.005em;
      color: var(--text-primary);
      margin: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      flex: 1 1 auto;
      min-width: 0;
      word-break: break-word;
    }
    @media (min-width: 768px) { .card-title { font-size: 13px; } }
    .card-price {
      font-size: 12px; font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      padding-top: 1px;
    }
    @media (min-width: 768px) { .card-price { font-size: 13px; } }
    .card-price.has-sale { color: var(--sale); }
    .card-price-original {
      font-size: 11px; font-weight: 400;
      color: var(--text-tertiary);
      text-decoration: line-through;
      margin-right: 4px;
    }

    /* ============================================
       SKELETON
       ============================================ */
    .skeleton-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 32px; width: 100%; }
    @media (min-width: 768px) { .skeleton-grid { gap: 28px; } }
    @media (min-width: 1024px) { .skeleton-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .skeleton-card { display: flex; flex-direction: column; }
    .skeleton-image { width: 100%; aspect-ratio: 1 / 1; background: var(--bg-skeleton); animation: pulse 1.6s ease-in-out infinite; }
    .skeleton-line { height: 10px; background: var(--bg-skeleton); margin-top: 14px; border-radius: 2px; animation: pulse 1.6s ease-in-out infinite; }
    .skeleton-line.short { width: 40%; }
    .skeleton-line.long { width: 80%; margin-top: 8px; }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.85; } }

    /* ============================================
       SELECTION BAR / DRAWER
       ============================================ */
    .selection-bar {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(160%);
      display: flex; align-items: center; gap: 8px;
      padding: 8px 8px 8px 20px;
      background: var(--accent);
      color: #FFFFFF;
      border-radius: 999px;
      box-shadow: var(--shadow-floating);
      z-index: 90;
      transition: transform var(--motion-base);
      max-width: calc(100vw - 32px);
    }
    .selection-bar.visible { transform: translateX(-50%) translateY(0); }
    .selection-count-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent;
      border: none;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 6px 4px;
      cursor: pointer;
    }
    .selection-count-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; opacity: 0.7; }
    .selection-share {
      display: inline-flex; align-items: center; gap: 6px;
      height: 42px; padding: 0 20px;
      background: #FFFFFF;
      color: var(--accent);
      border: none;
      border-radius: 999px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
      transition: opacity var(--motion-fast);
    }
    .selection-share:hover { opacity: 0.88; }
    .selection-share:disabled { opacity: 0.5; cursor: not-allowed; }
    .selection-share svg { width: 14px; height: 14px; }

    /* Selection drawer */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(10, 10, 10, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-base);
      z-index: 190;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-height: 70vh;
      max-height: 70dvh;
      background: var(--bg-elevated);
      border-radius: 16px 16px 0 0;
      box-shadow: var(--shadow-sheet);
      transform: translateY(100%);
      transition: transform var(--motion-base);
      z-index: 191;
      display: flex; flex-direction: column;
      padding-bottom: var(--safe-bottom);
    }
    .drawer.open { transform: translateY(0); }
    @media (min-width: 768px) {
      .drawer {
        max-height: 80vh;
        max-width: 520px;
        left: 50%;
        transform: translateX(-50%) translateY(100%);
        bottom: 16px;
        border-radius: 16px;
      }
      .drawer.open { transform: translateX(-50%) translateY(0); }
    }

    .drawer-handle {
      width: 40px; height: 4px;
      background: var(--border-strong);
      border-radius: 999px;
      margin: 10px auto 0;
      flex-shrink: 0;
    }
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .drawer-title { font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; margin: 0; }
    .drawer-clear {
      background: none; border: none;
      font-family: inherit;
      font-size: 11px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-secondary);
      transition: color var(--motion-fast);
      padding: 8px 0;
      min-height: 44px;
      display: flex; align-items: center;
    }
    .drawer-clear:hover { color: var(--text-primary); }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 0;
    }
    .drawer-empty {
      padding: 60px 24px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    .drawer-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px;
      transition: background var(--motion-fast);
    }
    .drawer-item:hover { background: var(--bg-pill-hover); }
    .drawer-thumb {

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
    // ============================================
    // CONFIG
    // ============================================
    const CONFIG = {
      SHOPIFY_ENDPOINT: '/.netlify/functions/photos-shopify-fetch',
      CONSIGNR_ENDPOINT: '/.netlify/functions/photos-consignr-fetch',
      LOCATIONS_ENDPOINT: '/.netlify/functions/photos-consignr-locations',
      IMAGE_PROXY: '/.netlify/functions/photos-image-proxy',
      MAX_PAGES: 50,
      CACHE_KEY: 'srla_photos_cache_v1',
      CACHE_TTL_MS: 5 * 60 * 1000,
      FETCH_TIMEOUT_MS: 15000,
      ANIMATION_CAP: 30,
      BRAND_LIST_MAX: 200,
      SELECTION_CAP: 50,
      MOBILE_PHOTO_CAP: 20,
      SHARE_CHUNK_SIZE: 20,
      IMAGE_FETCH_PARALLEL: 8,
      PAGE_SIZE: 40,
      INFINITE_SCROLL_MARGIN: '600px'
    };

    // ============================================
    // STATE
    // ============================================
    const state = {
      products: [],
      productIds: new Set(),
      productMap: new Map(),  // id -> product
      locationMode: null,      // {id, name} when viewing a Consignr physical location
      locationProducts: [],    // catalog-shaped products for the active location
      locationsList: null,     // cached [{id, name}] for the picker
      selected: new Set(),
      loading: true,
      loadController: null,
      shareController: null,
      activeCategory: 'all',
      searchQuery: '',
      activeSort: 'newest',
      filters: {
        brands: new Set(), sizes: new Set(),
        priceMin: null, priceMax: null,
        source: 'both', onSale: false
      },
      pendingFilters: null,
      toastTimer: null,
      renderedCount: 0,
      currentFiltered: [],
      scrollSentinelObserver: null,
      paginationLocked: false
    };

    // ============================================
    // UTILS
    // ============================================
    function log(...args) { try { console.log('[photos]', ...args); } catch(e) {} }
    function warn(...args) { try { console.warn('[photos]', ...args); } catch(e) {} }

    function formatPrice(amount) {
      if (amount == null) return '';
      const n = Number(amount);
      if (isNaN(n)) return '';
      return '$' + Math.round(n).toLocaleString('en-US');
    }
    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }
    function sanitizeFilename(s) {
      // Make safe for file system: alphanumeric + underscore + dash
      return String(s || '').replace(/[^a-zA-Z0-9\-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80) || 'item';
    }
    function isNewArrival(p) {
      if (Array.isArray(p.tags) && p.tags.some(t => /new arrival/i.test(t))) return true;
      if (p.published_at) {
        const ageMs = Date.now() - new Date(p.published_at).getTime();
        if (!isNaN(ageMs) && ageMs < 7 * 24 * 60 * 60 * 1000) return true;
      }
      return false;
    }
    function isHotPricePoint(p) {
      if (!p.compare_at_price || !p.on_sale) return false;
      if (!p.updated_at) return false;
      const ageMs = Date.now() - new Date(p.updated_at).getTime();
      return !isNaN(ageMs) && ageMs < 14 * 24 * 60 * 60 * 1000;
    }
    function safeFetchJSON(url, signal) {
      const ctrl = new AbortController();
      const timeoutId = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
      if (signal) signal.addEventListener('abort', () => ctrl.abort(), { once: true });
      return fetch(url, { signal: ctrl.signal })
        .then(res => { clearTimeout(timeoutId); if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .catch(e => { clearTimeout(timeoutId); throw e; });
    }
    function showToast(message, duration) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('visible');
      if (state.toastTimer) clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => el.classList.remove('visible'), duration || 2200);
    }

    // ============================================
    // LOCATION VIEW (Consignr physical locations)
    // ============================================
    function fetchLocationJSON(url, timeoutMs) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs || 28000);
      return fetch(url, { signal: ctrl.signal })
        .then(r => { clearTimeout(t); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .catch(e => { clearTimeout(t); throw e; });
    }
    function openLocationsPicker() {
      document.getElementById('location-sheet').classList.add('open');
      document.getElementById('location-sheet-overlay').classList.add('open');
      document.body.classList.add('sheet-open');
      renderLocationSheet();
      if (!state.locationsList) loadLocationsList();
    }
    function closeLocationsSheet() {
      document.getElementById('location-sheet').classList.remove('open');
      document.getElementById('location-sheet-overlay').classList.remove('open');
      document.body.classList.remove('sheet-open');
    }
    function loadLocationsList() {
      const body = document.getElementById('location-sheet-body');
      body.innerHTML = '<div style="padding:28px 24px;color:var(--text-secondary);font-size:13px;">Loading locations…</div>';
      fetchLocationJSON(CONFIG.LOCATIONS_ENDPOINT + '?action=locations', 15000)
        .then(d => { state.locationsList = (d && d.locations) || []; renderLocationSheet(); })
        .catch(() => { body.innerHTML = '<div style="padding:28px 24px;color:var(--text-secondary);font-size:13px;">Could not load locations. Close and tap Locations to retry.</div>'; });
    }
    function renderLocationSheet() {
      const body = document.getElementById('location-sheet-body');
      if (!state.locationsList) return; // loading state already shown
      const active = state.locationMode ? state.locationMode.id : null;
      let html = '<div class="location-list">';
      if (state.locationMode) {
        html += '<button class="location-row" data-loc-exit="1" type="button"><span class="location-row-name">&#8592; Back to full catalog</span></button>';
      }
      state.locationsList.forEach(function(L) {
        const nm = escapeHtml((L.name || '').trim());
        html += '<button class="location-row' + (L.id === active ? ' active' : '') + '" data-loc-id="' + escapeHtml(L.id) + '" data-loc-name="' + nm + '" type="button">' +
                  '<span class="location-row-name">' + nm + '</span>' +
                  (L.id === active ? '<span class="location-row-check">&#10003;</span>' : '') +
                '</button>';
      });
      html += '</div>';
      body.innerHTML = html;
      body.querySelectorAll('[data-loc-id]').forEach(function(btn) {
        btn.addEventListener('click', function() { enterLocation(btn.dataset.locId, btn.dataset.locName); });
      });
      const exitBtn = body.querySelector('[data-loc-exit]');
      if (exitBtn) exitBtn.addEventListener('click', exitLocation);
    }
    function enterLocation(id, name) {
      closeLocationsSheet();
      // Reset browse state so the whole location shows.
      state.searchQuery = '';
      const gs = document.getElementById('global-search'); if (gs) gs.value = '';
      state.activeCategory = 'all';
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.toggle('active', b.dataset.cat === 'all'));
      state.filters = { brands: new Set(), sizes: new Set(), priceMin: null, priceMax: null, source: 'both', onSale: false };
      updateFilterBadge();
      state.selected.clear();
      state.locationMode = { id: id, name: (name || '').trim() };
      state.locationProducts = [];
      renderLocationBanner(true);
      showLocationLoading();
      fetchLocationJSON(CONFIG.LOCATIONS_ENDPOINT + '?action=products&locationId=' + encodeURIComponent(id), 28000)
        .then(d => {
          if (!state.locationMode || state.locationMode.id !== id) return; // user changed/exited meanwhile
          const prods = (d && d.products) || [];
          state.locationProducts = prods;
          prods.forEach(p => state.productMap.set(p.id, p));
          const sk = document.getElementById('skeleton'); if (sk) sk.style.display = 'none';
          renderLocationBanner(false, prods.length);
          renderGrid();
          updateSelectionUI();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        })
        .catch(() => {
          if (!state.locationMode || state.locationMode.id !== id) return;
          renderLocationBanner(false, 0, true);
          showToast('Could not load this location. Try again.');
        });
    }
    function exitLocation() {
      closeLocationsSheet();
      state.locationMode = null;
      state.locationProducts = [];
      state.selected.clear();
      document.getElementById('location-banner').style.display = 'none';
      renderGrid();
      updateSelectionUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function showLocationLoading() {
      const grid = document.getElementById('grid'); if (grid) grid.innerHTML = '';
      const fe = document.getElementById('empty-filter-container');
      if (fe) { fe.style.display = 'block'; fe.innerHTML = '<div class="state"><p class="state-message"><span class="loading-dot"></span> Loading location photos…</p></div>'; }
    }
    function renderLocationBanner(loading, count, errored) {
      const el = document.getElementById('location-banner');
      if (!el || !state.locationMode) return;
      const nm = escapeHtml(state.locationMode.name);
      let right;
      if (loading) right = 'Loading&#8230;';
      else if (errored) right = 'Error';
      else right = (count || 0).toLocaleString() + ' piece' + (count === 1 ? '' : 's');
      el.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 20px;padding:12px 16px;background:var(--accent);color:#fff;border-radius:10px;font-size:13px;';
      el.innerHTML =
        '<span style="font-weight:500;letter-spacing:0.02em;">&#128205; ' + nm + ' &middot; <span style="opacity:0.85;">' + right + '</span></span>' +
        '<button type="button" id="location-exit-btn" style="background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;">&#10005; Exit</button>';
      const ex = document.getElementById('location-exit-btn');
      if (ex) ex.addEventListener('click', exitLocation);
    }

    // ============================================
    // CACHE
    // ============================================
    function readCache() {
      try {
        const raw = sessionStorage.getItem(CONFIG.CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.timestamp || !Array.isArray(parsed.products)) return null;
        if (Date.now() - parsed.timestamp > CONFIG.CACHE_TTL_MS) return null;
        log('cache hit:', parsed.products.length, 'products');
        return parsed.products;
      } catch (e) { warn('cache read failed:', e.message); return null; }
    }
    function writeCache(products) {
      try {
        sessionStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify({ timestamp: Date.now(), products: products }));
      } catch (e) { warn('cache write failed:', e.message); }
    }

    // ============================================
    // LAZY IMAGE LOADER
    // ============================================
    const imgObserver = 'IntersectionObserver' in window
      ? new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              if (img.dataset.src) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
              obs.unobserve(img);
            }
          });
        }, { rootMargin: '300px 0px', threshold: 0.01 })
      : null;

    // ============================================
    // CATEGORIZATION
    // ============================================
    function getProductCategories(p) {
      const cats = new Set(['all']);
      const type = (p.product_type || '').toLowerCase();
      const tags = Array.isArray(p.tags) ? p.tags.map(t => String(t).toLowerCase()) : [];
      if (isNewArrival(p)) cats.add('new');
      if (type.includes('clothing') && !type.includes('accessory')) cats.add('clothing');
      if (type === 'sneakers' || type === 'shoes' || type.includes('footwear')) cats.add('footwear');
      if (type.includes('accessory') || type === 'rings' || type === 'jewelry') cats.add('accessories');
      const isWomens = tags.some(t => t.includes('women')) || /\bwomen'?s?\b/i.test(p.title || '') || type.includes('women');
      if (isWomens) cats.add('womens');
      if (p.on_sale) cats.add('sale');
      return cats;
    }

    // ============================================
    // FILTERING + SORTING
    // ============================================
    function getFilteredProducts() {
      const cat = state.activeCategory;
      const f = state.filters;
      const base = state.locationMode ? state.locationProducts : state.products;
      let result = base.filter(p => {
        if (cat !== 'all') {
          const cats = getProductCategories(p);
          if (!cats.has(cat)) return false;
        }
        if (f.brands.size > 0) {
          const brand = (p.vendor || '').trim();
          if (!f.brands.has(brand)) return false;
        }
        if (f.sizes.size > 0) {
          const ps = Array.isArray(p.sizes) ? p.sizes : [];
          let m = false; for (const s of ps) { if (f.sizes.has(String(s))) { m = true; break; } }
          if (!m) return false;
        }
        const priceNum = parseFloat(p.price);
        if (f.priceMin != null && (isNaN(priceNum) || priceNum < f.priceMin)) return false;
        if (f.priceMax != null && (isNaN(priceNum) || priceNum > f.priceMax)) return false;
        if (f.source === 'online' && p.source !== 'shopify') return false;
        if (f.source === 'in-store' && p.source !== 'consignr') return false;
        if (f.onSale && !p.on_sale) return false;
        if (state.searchQuery) {
          const words = state.searchQuery.split(/\s+/).filter(Boolean);
          const hay = ((p.title || '') + ' ' + (p.vendor || '') + ' ' + (p.product_type || '') + ' ' + (Array.isArray(p.tags) ? p.tags.join(' ') : '')).toLowerCase();
          if (!words.every(function(w) { return hay.indexOf(w) !== -1; })) return false;
        }
        return true;
      });
      return sortProducts(result, state.activeSort);
    }
    function sortProducts(products, sortKey) {
      const sorted = products.slice();
      switch (sortKey) {
        case 'newest':
          sorted.sort((a, b) => new Date(b.published_at || b.created_at || 0) - new Date(a.published_at || a.created_at || 0));
          break;
        case 'just-dropped':
          sorted.sort((a, b) => {
            const an = isNewArrival(a) ? 1 : 0; const bn = isNewArrival(b) ? 1 : 0;
            if (an !== bn) return bn - an;
            return new Date(b.published_at || 0) - new Date(a.published_at || 0);
          });
          break;
        case 'hot-price':
          sorted.sort((a, b) => {
            const ah = isHotPricePoint(a) ? 1 : 0; const bh = isHotPricePoint(b) ? 1 : 0;
            if (ah !== bh) return bh - ah;
            return new Date(b.updated_at || 0) - new Date(a.updated_at || 0);
          });
          break;
        case 'price-high': sorted.sort((a, b) => (parseFloat(b.price) || 0) - (parseFloat(a.price) || 0)); break;
        case 'price-low': sorted.sort((a, b) => (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0)); break;
      }
      return sorted;
    }
    function activeFilterCount() {
      const f = state.filters; let c = 0;
      if (f.brands.size > 0) c += f.brands.size;
      if (f.sizes.size > 0) c += f.sizes.size;
      if (f.priceMin != null || f.priceMax != null) c += 1;
      if (f.source !== 'both') c += 1;
      if (f.onSale) c += 1;
      return c;
    }
    function sizeSortComparator(a, b) {
      const nA = parseFloat(a), nB = parseFloat(b);
      const aNum = !isNaN(nA), bNum = !isNaN(nB);
      if (aNum && bNum) return nA - nB;
      if (aNum) return -1; if (bNum) return 1;
      const order = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL', 'OS'];
      const ai = order.indexOf(String(a).toUpperCase()), bi = order.indexOf(String(b).toUpperCase());
      if (ai !== -1 && bi !== -1) return ai - bi;
      if (ai !== -1) return -1; if (bi !== -1) return 1;
      return String(a).localeCompare(String(b));
    }

    // ============================================
    // SELECTION
    // ============================================
    function isMobileDevice() {
      // Best-effort mobile detection: touch + share + small viewport OR iOS/Android UA
      if (typeof navigator === 'undefined') return false;
      const ua = navigator.userAgent || '';
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);
      const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      const hasShare = typeof navigator.share === 'function';
      // Mobile if: iOS/Android UA, OR (touch + share + narrow screen)
      return isIOS || isAndroid || (hasTouch && hasShare && window.innerWidth < 900);
    }

    function getProductPhotoCount(p) {
      return Array.isArray(p.images) ? p.images.length : 0;
    }

    function getSelectedPhotoCount() {
      let total = 0;
      state.selected.forEach(id => {
        const p = state.productMap.get(id);
        if (p) total += getProductPhotoCount(p);
      });
      return total;
    }

    function isAtCap() {
      // Desktop: product-based cap. Mobile: photo-based cap.
      if (isMobileDevice()) {
        return getSelectedPhotoCount() >= CONFIG.MOBILE_PHOTO_CAP;
      }
      return state.selected.size >= CONFIG.SELECTION_CAP;
    }

    function wouldExceedCap(productToAdd) {
      // Check if ADDING this specific product would push us over the cap
      if (isMobileDevice()) {
        const addPhotos = getProductPhotoCount(productToAdd);
        return (getSelectedPhotoCount() + addPhotos) > CONFIG.MOBILE_PHOTO_CAP;
      }
      return state.selected.size >= CONFIG.SELECTION_CAP;
    }

    function toggleSelection(productId, cardEl) {
      if (state.selected.has(productId)) {
        state.selected.delete(productId);
        if (cardEl) cardEl.classList.remove('selected');
      } else {
        const product = state.productMap.get(productId);
        if (!product) return false;

        if (isMobileDevice()) {
          // Mobile: check photo cap
          const addPhotos = getProductPhotoCount(product);
          const currentPhotos = getSelectedPhotoCount();
          // Special case: this single product itself exceeds cap (e.g. 25 photos in one product)
          if (state.selected.size === 0 && addPhotos > CONFIG.MOBILE_PHOTO_CAP) {
            showToast('This product has ' + addPhotos + ' photos · max is ' + CONFIG.MOBILE_PHOTO_CAP);
            return false;
          }
          if ((currentPhotos + addPhotos) > CONFIG.MOBILE_PHOTO_CAP) {
            const remaining = CONFIG.MOBILE_PHOTO_CAP - currentPhotos;
            showToast(remaining > 0 ? remaining + ' photo slot' + (remaining === 1 ? '' : 's') + ' left' : 'Photo limit reached · ' + CONFIG.MOBILE_PHOTO_CAP + ' max');
            return false;
          }
        } else {
          // Desktop: product cap
          if (state.selected.size >= CONFIG.SELECTION_CAP) {
            showToast(CONFIG.SELECTION_CAP + ' max');
            return false;
          }
        }

        state.selected.add(productId);
        if (cardEl) {
          cardEl.classList.add('selected');
          cardEl.classList.add('tap-bounce');
          setTimeout(() => cardEl.classList.remove('tap-bounce'), 320);
        }
      }
      updateSelectionUI();
      return true;
    }

    function clearAllSelection() {
      state.selected.clear();
      document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
      updateSelectionUI();
    }

    function updateSelectionUI() {
      const count = state.selected.size;
      const bar = document.getElementById('selection-bar');
      const numEl = document.getElementById('selection-count-num');
      const titleCount = document.getElementById('drawer-title-count');
      const photoMeta = document.getElementById('selection-photo-meta');
      numEl.textContent = count;
      if (titleCount) titleCount.textContent = count;
      bar.classList.toggle('visible', count > 0);

      // Photo count indicator (mobile only)
      if (photoMeta) {
        if (count > 0 && isMobileDevice()) {
          const photos = getSelectedPhotoCount();
          photoMeta.textContent = ' · ' + photos + '/' + CONFIG.MOBILE_PHOTO_CAP + ' photos';
        } else {
          photoMeta.textContent = '';
        }
      }

      // At-cap visual on grid
      const grid = document.getElementById('grid');
      grid.classList.toggle('at-cap', isAtCap());

      // Update drawer if open
      if (document.getElementById('drawer').classList.contains('open')) {
        renderDrawer();
      }
    }

    // ============================================
    // RENDER
    // ============================================
    function renderCard(p, indexInBatch) {
      const card = document.createElement('article');
      card.className = 'card';
      if (indexInBatch < CONFIG.ANIMATION_CAP) {
        card.style.animationDelay = (indexInBatch * 30) + 'ms';
      } else {
        card.style.animation = 'none';
        card.style.opacity = '1';
        card.style.transform = 'none';
      }
      card.dataset.id = p.id;
      if (state.selected.has(p.id)) card.classList.add('selected');

      const firstImage = (Array.isArray(p.images) && p.images.length > 0) ? (p.images[0].src || p.images[0]) : null;
      if (!firstImage) return null;

      const isNew = isNewArrival(p);
      const isSale = !!p.on_sale;
      const isInStore = p.source === 'consignr';
      const badges = [];
      if (isNew) badges.push('<span class="badge new">Just Dropped</span>');
      if (isSale) badges.push('<span class="badge sale">Sale</span>');
      if (isInStore) badges.push('<span class="badge in-store">In-Store Only</span>');

      const brand = p.vendor || 'Showroom LA';
      const title = p.title || '';
      let priceHTML = '';
      if (isSale && p.compare_at_price) {
        priceHTML = '<span class="card-price has-sale"><span class="card-price-original">' + formatPrice(p.compare_at_price) + '</span>' + formatPrice(p.price) + '</span>';
      } else if (p.price) {
        priceHTML = '<span class="card-price">' + formatPrice(p.price) + '</span>';
      }

      card.innerHTML =
        '<div class="card-image-wrap">' +
          (badges.length ? '<div class="card-badges">' + badges.join('') + '</div>' : '') +
          '<div class="card-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' +
          '<img class="card-image" loading="lazy" alt="' + escapeHtml(brand + ' ' + title) + '" data-src="' + escapeHtml(firstImage) + '">' +
        '</div>' +
        '<div class="card-meta">' +
          '<p class="card-brand">' + escapeHtml(brand) + '</p>' +
          '<div class="card-bottom">' +
            '<h3 class="card-title">' + escapeHtml(title) + '</h3>' +
            priceHTML +
          '</div>' +
        '</div>';

      const img = card.querySelector('.card-image');
      if (img) {
        if (imgObserver) imgObserver.observe(img); else img.src = img.dataset.src;
        img.addEventListener('load', () => img.classList.add('loaded'));
        img.addEventListener('error', () => { img.style.display = 'none'; });
      }

      card.addEventListener('click', () => toggleSelection(p.id, card));
      return card;
    }

    function onSearchInput(val) {
      const trimmed = val.trim();
      state.searchQuery = trimmed.toLowerCase();
      const clearBtn = document.getElementById('search-clear');
      if (clearBtn) clearBtn.className = 'search-clear' + (trimmed ? ' show' : '');
      updateSearchDropdown(trimmed);
      renderGrid();
    }

    function onSearchKey(e) {
      if (e.key === 'Enter') {
        const trimmed = e.target.value.trim();
        state.searchQuery = trimmed.toLowerCase();
        hideSearchDropdown();
        renderGrid();
        e.target.blur();
      }
      if (e.key === 'Escape') { clearSearch(); }
    }

    function clearSearch() {
      const el = document.getElementById('global-search');
      if (el) el.value = '';
      state.searchQuery = '';
      const clearBtn = document.getElementById('search-clear');
      if (clearBtn) clearBtn.className = 'search-clear';
      hideSearchDropdown();
      renderGrid();
    }

    function hideSearchDropdown() {
      const dd = document.getElementById('search-dropdown');
      if (dd) { dd.className = 'search-dropdown'; dd.innerHTML = ''; }
    }

    function updateSearchDropdown(val) {
      const dd = document.getElementById('search-dropdown');
      if (!dd) return;
      if (!val || val.length < 2) { hideSearchDropdown(); return; }
      const words = val.toLowerCase().split(/\s+/).filter(Boolean);
      const matches = [];
      const seen = new Set();
      for (const p of state.products) {
        const brand = (p.vendor || '').trim();
        const title = (p.title || '').trim();
        const key = brand + '|' + title;
        if (seen.has(key)) continue;
        const hay = (brand + ' ' + title + ' ' + (p.product_type || '') + ' ' + (Array.isArray(p.tags) ? p.tags.join(' ') : '')).toLowerCase();
        if (words.every(function(w) { return hay.indexOf(w) !== -1; })) {
          seen.add(key);
          matches.push({ brand, title });
          if (matches.length >= 3) break;
        }
      }
      if (matches.length === 0) {
        dd.innerHTML = '<div class="search-no-results">No results for "' + val + '"</div>';
      } else {
        dd.innerHTML = matches.map(function(m) {
          const safeVal = (m.brand + ' ' + m.title).replace(/'/g, "\'");
          return '<button class="search-suggestion" onclick="selectSuggestion(this)" data-val="' + safeVal + '">' +
            '<span class="search-suggestion-brand">' + m.brand + '</span>' +
            '<span class="search-suggestion-title">' + m.title + '</span>' +
          '</button>';
        }).join('');
      }
      dd.className = 'search-dropdown show';
    }

    function selectSuggestion(btn) {
      const val = btn.dataset.val || '';
      const el = document.getElementById('global-search');
      if (el) el.value = val;
      state.searchQuery = val.toLowerCase();
      const clearBtn = document.getElementById('search-clear');
      if (clearBtn) clearBtn.className = 'search-clear show';
      hideSearchDropdown();
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      const filterEmpty = document.getElementById('empty-filter-container');
      const filtered = getFilteredProducts();
      grid.innerHTML = '';
      filterEmpty.style.display = 'none';
      filterEmpty.innerHTML = '';
      state.renderedCount = 0;
      state.currentFiltered = filtered;
      removeScrollSentinel();

      if (filtered.length === 0 && state.locationMode) {
        filterEmpty.style.display = 'block';
        filterEmpty.innerHTML =
          '<div class="state">' +
            '<h2 class="state-title">No photos at this location</h2>' +
            '<p class="state-message">Nothing with images is currently at ' + escapeHtml(state.locationMode.name) + '.</p>' +
          '</div>';
        updateLoadStatus();
        return;
      }
      if (filtered.length === 0 && state.products.length > 0) {
        filterEmpty.style.display = 'block';
        filterEmpty.innerHTML =
          '<div class="state">' +
            '<h2 class="state-title">No pieces match your filters</h2>' +
            '<p class="state-message">Try removing a brand or expanding your price range.</p>' +
            '<button class="state-button" id="clear-filters-btn">Clear Filters</button>' +
          '</div>';
        document.getElementById('clear-filters-btn').addEventListener('click', clearAllFilters);
        updateLoadStatus();
        return;
      }

      // Render first page only
      renderNextPage();
      updateLoadStatus();
      updateSelectionUI();
    }

    function renderNextPage() {
      if (state.paginationLocked) return;
      state.paginationLocked = true;

      const grid = document.getElementById('grid');
      const filtered = state.currentFiltered;
      const start = state.renderedCount;
      const end = Math.min(start + CONFIG.PAGE_SIZE, filtered.length);

      if (start >= filtered.length) {
        removeScrollSentinel();
        state.paginationLocked = false;
        return;
      }

      const frag = document.createDocumentFragment();
      let appendedInBatch = 0;
      for (let i = start; i < end; i++) {
        const p = filtered[i];
        // For pagination, only animate the first page; subsequent pages appear instantly to avoid jank
        const animIdx = (start === 0) ? appendedInBatch : CONFIG.ANIMATION_CAP + 1;
        const card = renderCard(p, animIdx);
        if (card) { frag.appendChild(card); appendedInBatch++; }
      }
      grid.appendChild(frag);
      state.renderedCount = end;
      log('rendered page:', state.renderedCount, '/', filtered.length);

      // Set up sentinel for next page (if more to load)
      if (state.renderedCount < filtered.length) {
        setupScrollSentinel();
      } else {
        removeScrollSentinel();
      }

      state.paginationLocked = false;
    }

    function setupScrollSentinel() {
      removeScrollSentinel();
      const grid = document.getElementById('grid');
      const sentinel = document.createElement('div');
      sentinel.id = 'scroll-sentinel';
      sentinel.style.cssText = 'grid-column: 1 / -1; height: 1px; pointer-events: none;';
      grid.appendChild(sentinel);

      state.scrollSentinelObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !state.paginationLocked) {
          renderNextPage();
        }
      }, { rootMargin: CONFIG.INFINITE_SCROLL_MARGIN });
      state.scrollSentinelObserver.observe(sentinel);
    }

    function removeScrollSentinel() {
      if (state.scrollSentinelObserver) {
        state.scrollSentinelObserver.disconnect();
        state.scrollSentinelObserver = null;
      }
      const existing = document.getElementById('scroll-sentinel');
      if (existing) existing.remove();
    }

    function appendNewProductsFromAPI(newProducts) {
      let appended = 0;
      newProducts.forEach(p => {
        if (!p || !p.id) return;
        if (state.productIds.has(p.id)) return;
        if (!Array.isArray(p.images) || p.images.length === 0) return;
        state.productIds.add(p.id);
        state.products.push(p);
        state.productMap.set(p.id, p);
        appended++;
        if (state.products.length <= 5) {
          log('product loaded:', p.vendor, '·', p.title, '·', p.images.length, 'images');
        }
      });
      if (appended > 0) {
        // Recompute filtered+sorted list with new items
        const newFiltered = getFilteredProducts();

        const grid = document.getElementById('grid');
        const existingCards = grid.querySelectorAll('.card');

        if (existingCards.length === 0) {
          // First batch — initial render
          state.currentFiltered = newFiltered;
          renderNextPage();
        } else {
          // Subsequent batches — patch in place, no wipe
          patchGridInPlace(newFiltered);
        }
        updateLoadStatus();
      }
      return appended;
    }

    function patchGridInPlace(newFiltered) {
      // Smart-patch: keep existing cards if their position matches; only swap where order changed
      const grid = document.getElementById('grid');
      const sentinel = document.getElementById('scroll-sentinel');
      const currentCards = Array.from(grid.querySelectorAll('.card'));
      const currentCount = currentCards.length;
      const targetCount = Math.min(state.renderedCount, newFiltered.length);

      // Update internal sorted/filtered list
      state.currentFiltered = newFiltered;

      // For each currently-rendered position, check if the right product is there
      let position = 0;
      for (let i = 0; i < targetCount; i++) {
        const targetProduct = newFiltered[i];
        if (!targetProduct) break;
        const existingCard = currentCards[position];

        if (!existingCard) {
          // No card at this position yet — append new card
          const newCard = renderCard(targetProduct, CONFIG.ANIMATION_CAP + 1); // no animation
          if (newCard) {
            if (sentinel) grid.insertBefore(newCard, sentinel);
            else grid.appendChild(newCard);
          }
        } else if (existingCard.dataset.id !== String(targetProduct.id)) {
          // Different product should be here — swap card
          const newCard = renderCard(targetProduct, CONFIG.ANIMATION_CAP + 1);
          if (newCard) {
            existingCard.replaceWith(newCard);
            // Update currentCards reference at this position
            currentCards[position] = newCard;
          }
        }
        // else: card is correct, leave it alone (no re-paint, no flicker)
        position++;
      }

      // Remove any extra cards beyond the target count (shouldn't happen on append, but safe)
      while (position < currentCount) {
        const extra = currentCards[position];
        if (extra && extra.parentNode === grid) extra.remove();
        position++;
      }

      // Update renderedCount and ensure sentinel exists if more to load
      state.renderedCount = Math.min(state.renderedCount, newFiltered.length);
      if (state.renderedCount < newFiltered.length) {
        if (!document.getElementById('scroll-sentinel')) setupScrollSentinel();
      } else {
        removeScrollSentinel();
      }
    }

    function updateLoadStatus() {
      const el = document.getElementById('intro-meta');
      if (!el) return;
      const total = state.products.length;
      const filtered = getFilteredProducts().length;
      const showingFiltered = filtered !== total;
      let html = '';
      if (state.loading) {
        html += '<span class="loading-dot"></span><span>Loading the catalog</span>';
        html += '<span class="sep"></span><span>' + total.toLocaleString() + ' so far</span>';
      } else {
        if (showingFiltered) html += '<span>' + filtered.toLocaleString() + ' of ' + total.toLocaleString() + ' pieces</span>';
        else html += '<span>' + total.toLocaleString() + ' pieces</span>';
        html += '<span class="sep"></span><span>Select to share with clients</span>';
      }
      el.innerHTML = html;
    }
    function hideSkeleton() {
      const sk = document.getElementById('skeleton');
      if (sk && sk.style.display !== 'none') sk.style.display = 'none';
    }
    function showError(message) {
      hideSkeleton();
      const container = document.getElementById('error-container');
      container.style.display = 'block';
      container.innerHTML =
        '<div class="state">' +
          '<h2 class="state-title">Couldn\'t load the catalog</h2>' +
          '<p class="state-message">' + escapeHtml(message || 'Something went wrong. Please try again.') + '</p>' +
          '<button class="state-button" id="error-retry-btn">Retry</button>' +
        '</div>';
      document.getElementById('error-retry-btn').addEventListener('click', () => {
        container.style.display = 'none';
        container.innerHTML = '';
        document.getElementById('skeleton').style.display = '';
        loadCatalog();
      });
    }
    function showEmpty() {
      hideSkeleton();
      const container = document.getElementById('empty-container');
      container.style.display = 'block';
      container.innerHTML = '<div class="state"><h2 class="state-title">Nothing to show right now</h2><p class="state-message">The catalog appears to be empty. Please check back shortly.</p></div>';
    }

    // ============================================
    // LOAD CATALOG
    // ============================================
    async function loadCatalog() {
      state.products = []; state.productIds = new Set(); state.productMap = new Map();
      document.getElementById('grid').innerHTML = '';
      document.getElementById('error-container').style.display = 'none';
      document.getElementById('empty-container').style.display = 'none';
      state.loading = true;
      if (state.loadController) state.loadController.abort();
      state.loadController = new AbortController();
      const signal = state.loadController.signal;
      const cached = readCache();
      if (cached && cached.length > 0) {
        log('rendering from cache');
        hideSkeleton();
        appendNewProductsFromAPI(cached);
        state.loading = false;
        updateLoadStatus();
        loadFresh(signal, true);
        return;
      }
      await loadFresh(signal, false);
    }
    async function loadFresh(signal, silentRefresh) {
      const startTime = Date.now();
      let shopifyProducts = [], consignrProducts = [], anySuccess = false;
      for (let page = 1; page <= CONFIG.MAX_PAGES; page++) {
        if (signal.aborted) return;
        try {
          const data = await safeFetchJSON(CONFIG.SHOPIFY_ENDPOINT + '?page=' + page, signal);
          if (!data || !data.ok) { warn('shopify page', page, 'not-ok'); continue; }
          anySuccess = true;
          const pageProducts = Array.isArray(data.products) ? data.products : [];
          shopifyProducts = shopifyProducts.concat(pageProducts);
          if (!silentRefresh && pageProducts.length > 0) { hideSkeleton(); appendNewProductsFromAPI(pageProducts); }
          if (data.done) break;
        } catch (e) {
          if (e.name === 'AbortError') return;
          warn('shopify page', page, 'failed:', e.message);
        }
      }
      if (!signal.aborted) {
        try {
          const data = await safeFetchJSON(CONFIG.CONSIGNR_ENDPOINT, signal);
          if (data && data.ok && Array.isArray(data.products)) {
            consignrProducts = data.products;
            anySuccess = true;
            if (!silentRefresh && consignrProducts.length > 0) appendNewProductsFromAPI(consignrProducts);
          }
        } catch (e) {
          if (e.name === 'AbortError') return;
          warn('consignr failed:', e.message);
        }
      }
      state.loading = false;
      const elapsed = Date.now() - startTime;
      if (silentRefresh) {
        const all = shopifyProducts.concat(consignrProducts);
        if (all.length > 0) writeCache(all);
        return;
      }
      if (!anySuccess) { showError('Network request failed. Check your connection and try again.'); return; }
      if (state.products.length === 0) { showEmpty(); return; }
      hideSkeleton();
      updateLoadStatus();
      writeCache(shopifyProducts.concat(consignrProducts));
      log('catalog loaded:', state.products.length, 'products,', elapsed + 'ms');
    }

    // ============================================
    // SELECTION DRAWER
    // ============================================
    const drawer = document.getElementById('drawer');
    const drawerOverlay = document.getElementById('drawer-overlay');
    const drawerBody = document.getElementById('drawer-body');

    function openDrawer() {
      if (state.selected.size === 0) return;
      renderDrawer();
      drawer.classList.add('open');
      drawerOverlay.classList.add('open');
      document.body.classList.add('drawer-open');
    }
    function closeDrawer() {
      drawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
      document.body.classList.remove('drawer-open');
    }

    function renderDrawer() {
      const selectedIds = Array.from(state.selected);
      if (selectedIds.length === 0) {
        drawerBody.innerHTML = '<div class="drawer-empty">No items selected</div>';
        return;
      }
      const items = selectedIds.map(id => state.productMap.get(id)).filter(Boolean);
      drawerBody.innerHTML = items.map(p => {
        const firstImage = (Array.isArray(p.images) && p.images.length > 0) ? (p.images[0].src || p.images[0]) : '';
        const photoCount = Array.isArray(p.images) ? p.images.length : 0;
        const brand = p.vendor || 'Showroom LA';
        const title = p.title || '';
        const price = formatPrice(p.price);
        const photoLabel = photoCount === 1 ? '1 photo' : photoCount + ' photos';
        return (
          '<div class="drawer-item" data-id="' + escapeHtml(p.id) + '">' +
            '<div class="drawer-thumb">' + (firstImage ? '<img src="' + escapeHtml(firstImage) + '" alt="">' : '') + '</div>' +
            '<div class="drawer-info">' +
              '<span class="drawer-info-brand">' + escapeHtml(brand) + '</span>' +
              '<span class="drawer-info-title">' + escapeHtml(title) + '</span>' +
              '<span class="drawer-info-meta">' + (price ? price + ' · ' : '') + photoLabel + '</span>' +
            '</div>' +
            '<button class="drawer-remove" data-remove-id="' + escapeHtml(p.id) + '" aria-label="Remove">' +
              '<svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>' +
            '</button>' +
          '</div>'
        );
      }).join('');
    }

    drawerBody.addEventListener('click', e => {
      const btn = e.target.closest('.drawer-remove');
      if (!btn) return;
      const id = btn.dataset.removeId;
      state.selected.delete(id);
      // Update card in grid
      const card = document.querySelector('.card[data-id="' + CSS.escape(id) + '"]');
      if (card) card.classList.remove('selected');
      updateSelectionUI();
      if (state.selected.size === 0) closeDrawer();
    });

    document.getElementById('drawer-clear').addEventListener('click', () => {
      clearAllSelection();
      closeDrawer();
    });
    document.getElementById('selection-count-btn').addEventListener('click', openDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    function renderShareProgress(stage, current, total) {
      const pct = total > 0 ? Math.round((current / total) * 100) : 0;
      const stageLabels = {
        preparing: 'Preparing photos',
        fetching: 'Fetching images',

        sharing: 'Opening share sheet',
        zipping: 'Building zip file'
      };
      shareModalContent.innerHTML =
        '<h3 class="share-modal-title">' + (stageLabels[stage] || 'Sharing') + '</h3>' +
        '<p class="share-modal-subtitle">Please keep this window open</p>' +
        '<div class="share-progress-track"><div class="share-progress-bar" style="width:' + pct + '%"></div></div>' +
        '<p class="share-progress-text">' + current + ' of ' + total + ' &middot; ' + pct + '%</p>' +
        '<button class="share-cancel" id="share-cancel-btn">Cancel</button>';
