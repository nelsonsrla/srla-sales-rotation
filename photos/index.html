    function renderShareSuccess(message) {
      shareModalContent.innerHTML =
        '<div class="share-success-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' +
        '<h3 class="share-modal-title">Done</h3>' +
        '<p class="share-modal-subtitle">' + escapeHtml(message) + '</p>' +
        '<button class="share-done-btn" id="share-done-btn">Close</button>';
      document.getElementById('share-done-btn').addEventListener('click', closeShareModal);
    }
    function renderShareError(message) {
      shareModalContent.innerHTML =
        '<h3 class="share-modal-title">Share Failed</h3>' +
        '<p class="share-modal-subtitle">' + escapeHtml(message || 'Something went wrong. Please try again.') + '</p>' +
        '<button class="share-done-btn" id="share-done-btn">Close</button>';
      document.getElementById('share-done-btn').addEventListener('click', closeShareModal);
    }

    // Build the list of images to share for a given product
    function getProductShareImages(product) {
      // v1: all photos for the product
      // (v1.5 will add variant-specific filtering)
      if (!Array.isArray(product.images)) return [];
      return product.images.map(img => img.src || img).filter(Boolean);
    }

    // Build filenames for the share
    function buildShareManifest() {
      // Returns array of { url, filename, productId }
      const manifest = [];
      state.selected.forEach(id => {
        const p = state.productMap.get(id);
        if (!p) return;
        const brand = sanitizeFilename(p.vendor || 'SRLA');
        const title = sanitizeFilename(p.title || 'item');
        const images = getProductShareImages(p);
        images.forEach((url, idx) => {
          // Guess extension from URL
          let ext = 'jpg';
          const m = String(url).match(/\.(jpg|jpeg|png|webp|gif)(\?|$)/i);
          if (m) ext = m[1].toLowerCase();
          if (ext === 'jpeg') ext = 'jpg';
          const filename = brand + '_' + title + '_' + (idx + 1) + '.' + ext;
          manifest.push({ url, filename, productId: id, ext });
        });
      });
      return manifest;
    }

    // Fetch a single image as a Blob via image proxy
    async function fetchImageBlob(url, signal) {
      const proxyUrl = CONFIG.IMAGE_PROXY + '?url=' + encodeURIComponent(url);
      const res = await fetch(proxyUrl, { signal });
      if (!res.ok) throw new Error('image fetch failed: ' + res.status);
      return res.blob();
    }

    // Fetch images in parallel (limited concurrency)
    async function fetchAllImages(manifest, signal, onProgress) {
      const results = new Array(manifest.length);
      let completed = 0;
      let index = 0;

      async function worker() {
        while (true) {
          if (signal.aborted) throw new DOMException('aborted', 'AbortError');
          const i = index++;
          if (i >= manifest.length) return;
          const item = manifest[i];
          try {
            const blob = await fetchImageBlob(item.url, signal);
            results[i] = { ok: true, blob, item };
          } catch (e) {
            if (e.name === 'AbortError') throw e;
            warn('image fetch failed:', item.url, e.message);
            results[i] = { ok: false, item };
          }
          completed++;
          if (onProgress) onProgress(completed, manifest.length);
        }
      }

      const workers = [];
      for (let i = 0; i < Math.min(CONFIG.IMAGE_FETCH_PARALLEL, manifest.length); i++) {
        workers.push(worker());
      }
      await Promise.all(workers);
      return results.filter(r => r && r.ok);
    }

    async function executeShare() {
      if (state.selected.size === 0) return;

      // Lock buttons
      document.getElementById('share-btn').disabled = true;
      document.getElementById('drawer-share-btn').disabled = true;

      const manifest = buildShareManifest();
      if (manifest.length === 0) {
        showToast('No images to share');
        document.getElementById('share-btn').disabled = false;
        document.getElementById('drawer-share-btn').disabled = false;
        return;
      }

      log('share manifest:', manifest.length, 'images from', state.selected.size, 'products');

      state.shareController = new AbortController();
      const signal = state.shareController.signal;
      openShareModal();
      renderShareProgress('fetching', 0, manifest.length);

      try {
        const fetchedRaw = await fetchAllImages(manifest, signal, (done, total) => {
          renderShareProgress('fetching', done, total);
        });

        if (signal.aborted) return;

        if (fetchedRaw.length === 0) {
          renderShareError('Could not fetch any images. Check your connection and try again.');
          unlockShareButtons();
          return;
        }

        // Convert blobs to File objects with our filenames
        const files = fetchedRaw.map(r => {
          const mime = r.blob.type || (r.item.ext === 'png' ? 'image/png' : r.item.ext === 'webp' ? 'image/webp' : 'image/jpeg');
          return new File([r.blob], r.item.filename, { type: mime });
        });

        log('built', files.length, 'files');

        // ROUTING:
        // - Mobile (iOS/Android): always use Web Share API. Cap enforced upstream so files <= 20. Never ZIP.
        // - Desktop: try Web Share if supported (rare), else ZIP download.
        const mobile = isMobileDevice();
        const webShareAvailable = (
          typeof navigator !== 'undefined' &&
          typeof navigator.share === 'function' &&
          typeof navigator.canShare === 'function' &&
          files.length > 0
        );

        // === MOBILE PATH: Web Share only, no ZIP fallback ===
        if (mobile && webShareAvailable) {
          try {
            if (!navigator.canShare({ files: files })) {
              renderShareError('Your device can\'t share these photos directly. Try selecting fewer photos.');
              unlockShareButtons();
              return;
            }
            renderShareProgress('sharing', files.length, files.length);
            await navigator.share({ files: files, title: 'Showroom LA' });
            renderShareSuccess('Shared ' + files.length + ' photo' + (files.length === 1 ? '' : 's') + '.');
            unlockShareButtons();
            return;
          } catch (e) {
            if (e.name === 'AbortError') {
              // User dismissed iOS share sheet
              closeShareModal();
              unlockShareButtons();
              return;
            }
            warn('mobile web share failed:', e.message);
            renderShareError('Couldn\'t open share sheet. Please try again.');
            unlockShareButtons();
            return;
          }
        }

        // === DESKTOP PATH: Web Share if available, else ZIP ===
        if (!mobile && webShareAvailable && files.length <= CONFIG.SHARE_CHUNK_SIZE) {
          try {
            if (navigator.canShare({ files: files })) {
              renderShareProgress('sharing', files.length, files.length);
              await navigator.share({ files: files, title: 'Showroom LA' });
              renderShareSuccess('Shared ' + files.length + ' photo' + (files.length === 1 ? '' : 's') + '.');
              unlockShareButtons();
              return;
            }
          } catch (e) {
            if (e.name === 'AbortError') {
              closeShareModal();
              unlockShareButtons();
              return;
            }
            warn('desktop web share failed, falling back to zip:', e.message);
          }
        }

        // === DESKTOP ZIP FALLBACK ===
        renderShareProgress('zipping', 0, files.length);
        if (typeof JSZip === 'undefined') {
          renderShareError('Zip library failed to load. Please reload the page and try again.');
          unlockShareButtons();
          return;
        }

        const zip = new JSZip();
        files.forEach(f => zip.file(f.name, f));
        const zipBlob = await zip.generateAsync(
          { type: 'blob', compression: 'STORE' },
          (meta) => {
            if (signal.aborted) return;
            renderShareProgress('zipping', Math.round((meta.percent / 100) * files.length), files.length);
          }
        );

        if (signal.aborted) return;

        // Trigger download
        const today = new Date();
        const dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
        const zipName = 'SRLA_Photos_' + dateStr + '.zip';
        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url; a.download = zipName;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);

        renderShareSuccess('Downloaded ' + files.length + ' photos as a zip file.');
        unlockShareButtons();
      } catch (e) {
        if (e.name === 'AbortError') {
          // User canceled — modal already closed by closeShareModal
          unlockShareButtons();
          return;
        }
        warn('share failed:', e);
        renderShareError(e.message || 'Something went wrong.');
        unlockShareButtons();
      }
    }

    function unlockShareButtons() {
      document.getElementById('share-btn').disabled = false;
      document.getElementById('drawer-share-btn').disabled = false;
    }

    document.getElementById('share-btn').addEventListener('click', executeShare);
    document.getElementById('drawer-share-btn').addEventListener('click', executeShare);

    // ============================================
    // CATEGORY PILLS
    // ============================================
    document.getElementById('category-pills').addEventListener('click', e => {
      const btn = e.target.closest('.cat-pill');
      if (!btn) return;
      const cat = btn.dataset.cat;
      if (cat === state.activeCategory) return;
      state.activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
      renderGrid();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ============================================
    // SORT
    // ============================================
    const sortBtn = document.getElementById('sort-btn');
    const sortMenu = document.getElementById('sort-menu');
    const sortLabel = document.getElementById('sort-label');
    const SORT_LABELS = { 'newest': 'Newest', 'just-dropped': 'Just Dropped', 'hot-price': 'Hot Price Points', 'price-high': 'Price High → Low', 'price-low': 'Price Low → High' };
    sortBtn.addEventListener('click', e => {
      e.stopPropagation();
      const isOpen = sortMenu.classList.toggle('open');
      sortBtn.classList.toggle('open', isOpen);
      sortBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    sortMenu.addEventListener('click', e => {
      const btn = e.target.closest('.sort-option');
      if (!btn) return;
      const key = btn.dataset.sort;
      state.activeSort = key;
      sortLabel.textContent = SORT_LABELS[key] || 'Sort';
      document.querySelectorAll('.sort-option').forEach(b => b.classList.toggle('active', b.dataset.sort === key));
      sortMenu.classList.remove('open');
      sortBtn.classList.remove('open');
      renderGrid();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.addEventListener('click', () => {
      if (sortMenu.classList.contains('open')) {
        sortMenu.classList.remove('open');
        sortBtn.classList.remove('open');
      }
    });

    // ============================================
    // FILTER SHEET
    // ============================================
    const sheet = document.getElementById('sheet');
    const sheetOverlay = document.getElementById('sheet-overlay');
    const sheetBody = document.getElementById('sheet-body');
    const filterBadge = document.getElementById('filter-badge');
    const sheetApplyCount = document.getElementById('sheet-apply-count');

    function cloneFilters(f) {
      return { brands: new Set(f.brands), sizes: new Set(f.sizes), priceMin: f.priceMin, priceMax: f.priceMax, source: f.source, onSale: f.onSale };
    }
    function openFilterSheet() {
      state.pendingFilters = cloneFilters(state.filters);
      buildFilterSheet();
      sheet.classList.add('open');
      sheetOverlay.classList.add('open');
      document.body.classList.add('sheet-open');
      updateApplyButton();
    }
    function closeFilterSheet() {
      sheet.classList.remove('open');
      sheetOverlay.classList.remove('open');
      document.body.classList.remove('sheet-open');
      state.pendingFilters = null;
    }
    function buildFilterSheet() {
      const brandCounts = {}; const sizesSet = new Set();
      state.products.forEach(p => {
        const v = (p.vendor || '').trim();
        if (v) brandCounts[v] = (brandCounts[v] || 0) + 1;
        if (Array.isArray(p.sizes)) p.sizes.forEach(s => { if (s) sizesSet.add(String(s)); });
      });
      const brands = Object.keys(brandCounts).sort((a, b) => a.localeCompare(b)).slice(0, CONFIG.BRAND_LIST_MAX);
      const sizes = Array.from(sizesSet).sort(sizeSortComparator);
      const pf = state.pendingFilters;

      sheetBody.innerHTML =
        '<div class="filter-section expanded" data-section="brand">' +
          '<button class="filter-section-header" type="button"><span><span class="filter-section-count" id="brand-count" ' + (pf.brands.size === 0 ? 'style="display:none"' : '') + '>' + pf.brands.size + '</span>Brand</span><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>' +
          '<div class="filter-section-content">' +
            '<div class="filter-section-clear" id="brand-clear-wrap" ' + (pf.brands.size === 0 ? 'style="display:none"' : '') + '><button type="button" data-clear-section="brand">Clear brands</button></div>' +
            '<input type="text" class="brand-search" id="brand-search" placeholder="Search brands" autocomplete="off">' +
            '<div class="brand-list" id="brand-list">' +
              brands.map(b => '<button class="brand-item' + (pf.brands.has(b) ? ' checked' : '') + '" data-brand="' + escapeHtml(b) + '" type="button"><span class="brand-item-left"><span class="brand-checkbox"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span><span class="brand-name">' + escapeHtml(b) + '</span></span><span class="brand-count">' + brandCounts[b].toLocaleString() + '</span></button>').join('') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="filter-section' + (pf.sizes.size > 0 ? ' expanded' : '') + '" data-section="size">' +
          '<button class="filter-section-header" type="button"><span><span class="filter-section-count" id="size-count" ' + (pf.sizes.size === 0 ? 'style="display:none"' : '') + '>' + pf.sizes.size + '</span>Size</span><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>' +
          '<div class="filter-section-content">' +
            '<div class="filter-section-clear" id="size-clear-wrap" ' + (pf.sizes.size === 0 ? 'style="display:none"' : '') + '><button type="button" data-clear-section="size">Clear sizes</button></div>' +
            '<div class="size-chips" id="size-chips">' +
              sizes.map(s => '<button class="size-chip' + (pf.sizes.has(s) ? ' active' : '') + '" data-size="' + escapeHtml(s) + '" type="button">' + escapeHtml(s) + '</button>').join('') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="filter-section' + (pf.priceMin != null || pf.priceMax != null ? ' expanded' : '') + '" data-section="price">' +
          '<button class="filter-section-header" type="button"><span>Price</span><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>' +
          '<div class="filter-section-content">' +
            '<div class="filter-section-clear" id="price-clear-wrap" ' + (pf.priceMin == null && pf.priceMax == null ? 'style="display:none"' : '') + '><button type="button" data-clear-section="price">Clear price</button></div>' +
            '<div class="price-row">' +
              '<div class="price-input-wrap"><input type="number" inputmode="numeric" class="price-input" id="price-min" placeholder="Min" value="' + (pf.priceMin != null ? pf.priceMin : '') + '"></div>' +
              '<span class="price-dash">–</span>' +
              '<div class="price-input-wrap"><input type="number" inputmode="numeric" class="price-input" id="price-max" placeholder="Max" value="' + (pf.priceMax != null ? pf.priceMax : '') + '"></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="filter-section' + (pf.source !== 'both' ? ' expanded' : '') + '" data-section="source">' +
          '<button class="filter-section-header" type="button"><span>Source</span><svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>' +
          '<div class="filter-section-content">' +
            '<div class="filter-section-clear" id="source-clear-wrap" ' + (pf.source === 'both' ? 'style="display:none"' : '') + '><button type="button" data-clear-section="source">Reset to both</button></div>' +
            '<div class="radio-group" id="source-group">' +
              '<button class="radio-item' + (pf.source === 'both' ? ' checked' : '') + '" data-source="both" type="button"><span class="radio-circle"></span>Both</button>' +
              '<button class="radio-item' + (pf.source === 'online' ? ' checked' : '') + '" data-source="online" type="button"><span class="radio-circle"></span>Online</button>' +
              '<button class="radio-item' + (pf.source === 'in-store' ? ' checked' : '') + '" data-source="in-store" type="button"><span class="radio-circle"></span>In-Store Only</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="filter-section expanded" data-section="sale">' +
          '<div class="filter-section-content" style="padding-top: 16px"><div class="toggle-row"><span class="toggle-label">On Sale Only</span><button class="toggle' + (pf.onSale ? ' on' : '') + '" id="sale-toggle" type="button" aria-pressed="' + (pf.onSale ? 'true' : 'false') + '"></button></div></div>' +
        '</div>';

      sheetBody.querySelectorAll('.filter-section-header').forEach(h => h.addEventListener('click', () => h.parentElement.classList.toggle('expanded')));

      // Per-section "Clear" handlers
      sheetBody.querySelectorAll('[data-clear-section]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const section = btn.dataset.clearSection;
          clearFilterSection(section);
        });
      });

      const bs = document.getElementById('brand-search');
      if (bs) bs.addEventListener('input', () => {
        const q = bs.value.trim().toLowerCase();
        document.querySelectorAll('#brand-list .brand-item').forEach(item => {
          const name = (item.dataset.brand || '').toLowerCase();
          item.style.display = (!q || name.includes(q)) ? '' : 'none';
        });
      });
      document.getElementById('brand-list').addEventListener('click', e => {
        const item = e.target.closest('.brand-item');
        if (!item) return;
        const brand = item.dataset.brand;
        if (state.pendingFilters.brands.has(brand)) state.pendingFilters.brands.delete(brand);
        else state.pendingFilters.brands.add(brand);
        item.classList.toggle('checked');
        const bc = document.getElementById('brand-count');
        if (bc) { const n = state.pendingFilters.brands.size; bc.textContent = n; bc.style.display = n > 0 ? '' : 'none'; }
        updateApplyButton();
      });
      document.getElementById('size-chips').addEventListener('click', e => {
        const chip = e.target.closest('.size-chip');
        if (!chip) return;
        const s = chip.dataset.size;
        if (state.pendingFilters.sizes.has(s)) state.pendingFilters.sizes.delete(s);
        else state.pendingFilters.sizes.add(s);
        chip.classList.toggle('active');
        const sc = document.getElementById('size-count');
        if (sc) { const n = state.pendingFilters.sizes.size; sc.textContent = n; sc.style.display = n > 0 ? '' : 'none'; }
        updateApplyButton();
      });
      const pmin = document.getElementById('price-min'), pmax = document.getElementById('price-max');
      function onPriceChange() {
        const minV = parseFloat(pmin.value), maxV = parseFloat(pmax.value);
        state.pendingFilters.priceMin = isNaN(minV) ? null : minV;
        state.pendingFilters.priceMax = isNaN(maxV) ? null : maxV;
        updateApplyButton();
      }
      pmin.addEventListener('input', onPriceChange);
      pmax.addEventListener('input', onPriceChange);
      document.getElementById('source-group').addEventListener('click', e => {
        const item = e.target.closest('.radio-item'); if (!item) return;
        state.pendingFilters.source = item.dataset.source;
        document.querySelectorAll('#source-group .radio-item').forEach(r => r.classList.toggle('checked', r === item));
        updateApplyButton();
      });
      const st = document.getElementById('sale-toggle');
      st.addEventListener('click', () => {
        state.pendingFilters.onSale = !state.pendingFilters.onSale;
        st.classList.toggle('on', state.pendingFilters.onSale);
        st.setAttribute('aria-pressed', state.pendingFilters.onSale ? 'true' : 'false');
        updateApplyButton();
      });
    }
    function updateApplyButton() {
      const real = state.filters;
      state.filters = state.pendingFilters;
      const count = getFilteredProducts().length;
      state.filters = real;
      sheetApplyCount.textContent = count > 0 ? '· ' + count.toLocaleString() : '';
    }
    function applyPendingFilters() {
      state.filters = state.pendingFilters;
      state.pendingFilters = null;
      updateFilterBadge();
      renderGrid();
      closeFilterSheet();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function clearPendingFilters() {
      state.pendingFilters = { brands: new Set(), sizes: new Set(), priceMin: null, priceMax: null, source: 'both', onSale: false };
      buildFilterSheet();
      updateApplyButton();
    }
    function clearFilterSection(section) {
      if (!state.pendingFilters) return;
      switch (section) {
        case 'brand': state.pendingFilters.brands = new Set(); break;
        case 'size': state.pendingFilters.sizes = new Set(); break;
        case 'price': state.pendingFilters.priceMin = null; state.pendingFilters.priceMax = null; break;
        case 'source': state.pendingFilters.source = 'both'; break;
      }
      buildFilterSheet();
      updateApplyButton();
    }
    function clearAllFilters() {
      state.filters = { brands: new Set(), sizes: new Set(), priceMin: null, priceMax: null, source: 'both', onSale: false };
      state.activeCategory = 'all';
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.toggle('active', b.dataset.cat === 'all'));
      updateFilterBadge();
      renderGrid();
    }
    function updateFilterBadge() {
      const n = activeFilterCount();
      const btn = document.getElementById('filter-btn');
      if (n > 0) { filterBadge.textContent = n; filterBadge.style.display = ''; btn.classList.add('active'); }
      else { filterBadge.style.display = 'none'; btn.classList.remove('active'); }
    }

    document.getElementById('filter-btn').addEventListener('click', openFilterSheet);
    document.getElementById('sheet-close').addEventListener('click', closeFilterSheet);
    document.getElementById('sheet-overlay').addEventListener('click', closeFilterSheet);
    document.getElementById('sheet-clear').addEventListener('click', clearPendingFilters);
    document.getElementById('sheet-apply').addEventListener('click', applyPendingFilters);

    // ============================================
    // COLUMN TOGGLE
    // ============================================
    const colToggle = document.querySelector('.col-toggle');
    const COL_STORAGE_KEY = 'srla_photos_cols';
    function getDefaultCols() { return window.matchMedia('(min-width: 1024px)').matches ? '4' : '2'; }
    function applyCols(cols) {
      const grid = document.getElementById('grid');
      grid.dataset.cols = cols;
      colToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.cols === cols));
      try { localStorage.setItem(COL_STORAGE_KEY, cols); } catch (e) {}
    }
    let initialCols;
    try { initialCols = localStorage.getItem(COL_STORAGE_KEY); } catch (e) {}
    applyCols(initialCols || getDefaultCols());
    colToggle.addEventListener('click', e => {
      const btn = e.target.closest('button[data-cols]');
      if (!btn) return;
      applyCols(btn.dataset.cols);
    });

    // ============================================
    // SCROLL
    // ============================================
    const header = document.querySelector('.header');
    const toolbar = document.getElementById('toolbar');
    window.addEventListener('scroll', () => {
      const scrolled = window.scrollY > 4;
      header.style.borderBottomColor = scrolled ? 'var(--border-strong)' : 'var(--border)';
      toolbar.classList.toggle('scrolled', window.scrollY > 80);
    }, { passive: true });

    window.addEventListener('beforeunload', () => {
      if (state.loadController) state.loadController.abort();
      if (state.shareController) state.shareController.abort();
    });

    loadCatalog();
  </script>
